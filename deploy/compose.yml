name: dongba-lijiang
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: dongba
      MYSQL_USER: dongba
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_bin"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DONGBA_ENVIRONMENT: production
      DONGBA_DATABASE_URL: ${DONGBA_DATABASE_URL:?Set encoded MySQL DSN with host db}
      DONGBA_AUTO_CREATE_SCHEMA: "false"
      DONGBA_SETUP_ENABLED: "false"
      DONGBA_PUBLIC_BASE_URL: ${DONGBA_PUBLIC_BASE_URL:?Set public HTTPS origin}
      DONGBA_TRUSTED_HOSTS: ${DONGBA_TRUSTED_HOSTS:?Set JSON array of trusted domain names}
      DONGBA_WECHAT_APP_ID: ${DONGBA_WECHAT_APP_ID:-}
      DONGBA_WECHAT_APP_SECRET: ${DONGBA_WECHAT_APP_SECRET:-}
      DONGBA_PROVIDER_NAME: ${DONGBA_PROVIDER_NAME:-unconfigured}
      DONGBA_PROVIDER_ENDPOINT: ${DONGBA_PROVIDER_ENDPOINT:-}
      DONGBA_PROVIDER_API_KEY: ${DONGBA_PROVIDER_API_KEY:-}
      DONGBA_PROVIDER_MODEL: ${DONGBA_PROVIDER_MODEL:-}
      DONGBA_PRIVACY_POLICY_PUBLISHED: ${DONGBA_PRIVACY_POLICY_PUBLISHED:-false}
      DONGBA_PRIVACY_CONTACT: ${DONGBA_PRIVACY_CONTACT:-}
      DONGBA_RETENTION_DAYS: ${DONGBA_RETENTION_DAYS:-30}
    volumes:
      - media:/app/runtime/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
volumes:
  mysql_data:
  media:
